name: geof212env
channels:
    - conda-forge
dependencies:
    - python=3.11        # modern, actively supported Python (3.8 is EOL and drags in ancient jupyterlab)
    - cartopy             # Geographic plotting toolkit
    - jupyterlab>=4        # Jupyter Lab environment
    - notebook>=7          # classic notebook interface (used alongside jupyterlab)
    - ipykernel             # install python env as jupyter kernel
    - nb_conda_kernels       # makes this env's kernel visible from other Jupyter installs
    - matplotlib             # 2D plotting library
    - netcdf4                 # Wrapper for netcdf4
    - numpy                    # N-d array and numerics
    - xarray                    # N-d labeled array library
